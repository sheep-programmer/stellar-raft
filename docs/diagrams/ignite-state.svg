<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Segoe UI','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#0a0e20"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fc6ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd98a"/>
    </marker>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <text x="34" y="42" fill="#8a94a8" font-size="12" letter-spacing="3" font-family="monospace">IGNITE · 点亮状态机</text>

  <!-- Unlit -> Lit -->
  <line x1="252" y1="120" x2="332" y2="120" stroke="#9fc6ff" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="292" y="108" fill="#c9d6f0" font-size="12" text-anchor="middle">费曼讲透</text>

  <!-- Lit -> Ember -->
  <line x1="562" y1="120" x2="638" y2="120" stroke="#e8917a" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="600" y="108" fill="#c9d6f0" font-size="12" text-anchor="middle">R &lt; 0.35</text>
  <text x="600" y="141" fill="#8a94a8" font-size="11" text-anchor="middle">衰减 / 忘了</text>

  <!-- Ember -> Lit (arc) -->
  <path d="M735 166 C735 236, 455 236, 455 170" fill="none" stroke="#ffd98a" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="595" y="230" fill="#ffd98a" font-size="12" text-anchor="middle">费曼快速通道 · 重燃(门槛减半)</text>

  <!-- Lit self loop -->
  <path d="M408 90 C408 42, 482 42, 482 90" fill="none" stroke="#9fc6ff" stroke-width="1.4" marker-end="url(#ab)"/>
  <text x="445" y="34" fill="#c9d6f0" font-size="11.5" text-anchor="middle">复习成功 · 巩固</text>

  <!-- nodes -->
  <rect x="62" y="92" width="190" height="56" rx="14" fill="#111a33" stroke="#9fc6ff" stroke-opacity="0.5" stroke-width="1.4"/>
  <circle cx="94" cy="120" r="6" fill="#7896cd"/>
  <text x="114" y="116" fill="#e8eefc" font-size="15">未点亮</text>
  <text x="114" y="135" fill="#8a94a8" font-size="11">Unlit · 冷蓝暗星</text>

  <g filter="url(#goldGlow)">
    <rect x="352" y="92" width="190" height="56" rx="14" fill="#2a2313" stroke="#ffd98a" stroke-width="1.6"/>
    <circle cx="384" cy="120" r="6.5" fill="#fff4d6"/>
    <text x="404" y="116" fill="#ffffff" font-size="15">已点亮</text>
    <text x="404" y="135" fill="#ffd98a" font-size="11">Lit · 暖金白 · 已认证</text>
  </g>

  <rect x="640" y="92" width="190" height="56" rx="14" fill="#1b1710" stroke="#b98a4a" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="672" cy="120" r="6" fill="#b98a4a"/>
  <text x="692" y="116" fill="#e8eefc" font-size="15">待重燃</text>
  <text x="692" y="135" fill="#8a94a8" font-size="11">Ember · 余烬</text>

  <text x="450" y="284" fill="#8a94a8" font-size="12.5" text-anchor="middle" font-family="monospace">亮度 R = exp(−Δt / S) · 冷蓝(遗忘) → 暖金白(掌握)</text>
</svg>
