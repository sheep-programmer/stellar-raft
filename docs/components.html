  <main class="docs-main">
    <div class="hud-label">COMPONENTS</div>
    <h1 class="docs-h1">组件</h1>
    <p class="docs-lede">全部组件编译于 <code>_ds_bundle.js</code>，挂载在命名空间 <code>window.StellarRaftDesignSystem_2866af</code> 下。本页由 <code>docs/registry.js</code> 里的单一数组 <code>REGISTRY</code> 驱动——新增组件只需往数组追加一项。props 表提炼自各组件的 <code>.d.ts</code>，用法要点提炼自 <code>.prompt.md</code>。</p>

    <nav class="anchor-rail" id="anchor-rail" aria-label="组件锚点"></nav>

    <div id="gallery"></div>
  </main>

  <footer class="docs-footer">
    <span>星图 · Stellar Raft 设计系统 —— 知识是唯一的光。</span>
    <span class="mono" id="reg-count"></span>
  </footer>

  <script src="../assets/starfield.js"></script>
  <script src="registry.js"></script>
  <script>
  /* ===== 画廊渲染：完全由 REGISTRY 驱动，零手写组件章节 ===== */
  (function () {
    var gallery = document.getElementById('gallery');
    var rail = document.getElementById('anchor-rail');
    var seenCards = {};   /* 同一张演示卡只嵌一次（按路径去重） */
    var seenGroups = {};

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    REGISTRY.forEach(function (c) {
      /* 锚点胶囊 */
      var a = el('a', null, c.name);
      a.href = '#' + c.id;
      rail.appendChild(a);

      /* 分组头（同组仅一次） */
      if (!seenGroups[c.group]) {
        seenGroups[c.group] = true;
        var gs = el('section', 'docs-section');
        gs.appendChild(el('div', 'hud-label', c.groupLabel || c.group.toUpperCase()));
        gallery.appendChild(gs);
      }

      /* 演示卡（同一路径仅嵌一次） */
      if (c.card && !seenCards[c.card]) {
        seenCards[c.card] = true;
        var fc = el('div', 'frame-card');
        var f = document.createElement('iframe');
        f.src = c.card;
        f.style.height = (c.cardHeight || 360) + 24 + 'px';
        f.loading = 'lazy';
        f.title = (c.groupLabel || c.group) + ' 演示卡';
        f.setAttribute('data-theme-sync', '');
        fc.appendChild(f);
        gallery.appendChild(fc);
      }

      /* 组件章节 */
      var sec = el('section', 'comp-section');
      sec.id = c.id;

      var head = el('div', 'comp-head');
      head.appendChild(el('h3', null, c.name));
      head.appendChild(el('span', 'cn', c.cn));
      var src = el('span', 'sub');
      src.style.cssText = 'font-family:var(--font-mono);font-size:11px;color:var(--text-3)';
      src.textContent = (c.dts || '').replace('../', '');
      head.appendChild(src);
      sec.appendChild(head);

      sec.appendChild(el('p', 'summary', c.summary));

      /* 代码示例 */
      if (c.code) {
        var cb = el('div', 'codeblock');
        cb.appendChild(el('div', 'cb-head', c.name + ' · 用法'));
        var pre = el('pre');
        pre.textContent = c.code;
        cb.appendChild(pre);
        sec.appendChild(cb);
      }

      /* props 表 */
      if (c.props && c.props.length) {
        var scroll = el('div', 'table-scroll');
        var table = el('table', 'tk-table');
        var thead = el('thead');
        var htr = el('tr');
        ['Prop', '类型', '默认', '说明'].forEach(function (h) { htr.appendChild(el('th', null, h)); });
        thead.appendChild(htr);
        table.appendChild(thead);
        var tbody = el('tbody');
        c.props.forEach(function (p) {
          var tr = el('tr');
          tr.appendChild(el('td', 'tok', p.name));
          var tdType = el('td', 'val', p.type);
          tdType.style.whiteSpace = 'normal';
          tr.appendChild(tdType);
          tr.appendChild(el('td', 'val', p.def || '—'));
          tr.appendChild(el('td', null, p.desc));
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        scroll.appendChild(table);
        sec.appendChild(scroll);
      }

      /* 用法要点 */
      if (c.usage && c.usage.length) {
        var ul = el('ul', 'usage-list');
        c.usage.forEach(function (u) { ul.appendChild(el('li', null, u)); });
        sec.appendChild(ul);
      }

      gallery.appendChild(sec);
    });

    document.getElementById('reg-count').textContent =
      'REGISTRY · ' + REGISTRY.length + ' COMPONENTS · WINDOW.STELLARRAFTDESIGNSYSTEM_2866AF';
  })();
  </script>
