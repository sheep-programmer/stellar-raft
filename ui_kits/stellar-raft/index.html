  <style>
    html, body { margin: 0; height: 100%; background: var(--space-void); transition: background var(--dur-base); }
    #root { width: 100vw; height: 100vh; font-family: var(--font-sans); }
    .sr-stage { width: 100%; height: 100%; background: var(--bg-deepspace); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: rgba(159,198,255,0.16); border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    * { scrollbar-width: thin; scrollbar-color: rgba(159,198,255,0.16) transparent; }
    [contenteditable]:empty:before { content: attr(data-ph); color: var(--text-3); pointer-events: none; }
    [contenteditable] { caret-color: var(--star-blue); }
    /* 设置页「动效」开关的落点：关闭动效收敛所有动画，关闭闪烁隐藏背景星场 */
    html[data-motion="off"] *, html[data-motion="off"] *::before, html[data-motion="off"] *::after {
      animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important;
    }
    html[data-twinkle="off"] sr-starfield { display: none; }
  </style>

<body>
  <div id="root" class="sr-stage"></div>

  <!-- 静态启动帧：Babel 现场编译的几秒里不再是一块纯黑幕布。
       app 挂载后（app.jsx）置 data-done 淡出；8s 未就绪则转为网络兜底提示。 -->
  <div id="sr-boot" role="status">
    <div class="sr-boot-stars" aria-hidden="true"></div>
    <div class="sr-boot-center">
      <div class="sr-boot-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64">
          <defs>
            <linearGradient id="sr-logo-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffe9b8"/><stop offset="1" stop-color="#ffb86b"/>
            </linearGradient>
          </defs>
          <path d="M13 49 L24 37 M42 20 L52 12" stroke="rgba(159,198,255,0.45)" stroke-width="1.2"/>
          <circle cx="13" cy="49" r="2.2" fill="#9fc6ff" opacity="0.9"/>
          <circle cx="52" cy="12" r="1.7" fill="#9fc6ff" opacity="0.75"/>
          <path d="M33 8 C34.6 23 37.4 25.8 52 27.5 C37.4 29.2 34.6 32 33 47 C31.4 32 28.6 29.2 14 27.5 C28.6 25.8 31.4 23 33 8 Z" fill="url(#sr-logo-g)"/>
        </svg>
      </div>
      <div class="sr-boot-mark">星图</div>
      <div class="sr-boot-sub">STELLAR RAFT</div>
      <div class="sr-boot-msg" id="sr-boot-msg">正在点亮你的星空…</div>
    </div>
  </div>
  <style>
    #sr-boot { position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(1200px 800px at 78% -10%, rgba(26,35,80,0.55), transparent 60%),
        radial-gradient(900px 700px at 12% 110%, rgba(40,30,70,0.35), transparent 60%),
        linear-gradient(180deg, #05060f 0%, #03040c 55%, #04050e 100%);
      transition: opacity 560ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    #sr-boot[data-done] { opacity: 0; pointer-events: none; }
    .sr-boot-center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .sr-boot-logo { margin-bottom: 6px; filter: drop-shadow(0 0 14px rgba(255,217,138,0.35)) drop-shadow(0 0 30px rgba(159,198,255,0.18));
      animation: sr-boot-logo 3.2s ease-in-out infinite; }
    .sr-boot-logo svg { display: block; }
    @keyframes sr-boot-logo { 0%, 100% { transform: scale(0.97); opacity: 0.9; } 50% { transform: scale(1.03); opacity: 1; } }
    .sr-boot-mark { font: 300 36px/1.25 Sora, "Noto Sans SC", -apple-system, sans-serif; letter-spacing: 0.08em;
      background: linear-gradient(176deg, #fff3da 0%, #ffffff 30%, #e9f0ff 62%, #b6cbf2 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(159,198,255,0.22)); }
    .sr-boot-sub { font: 400 10px/1 "JetBrains Mono", monospace; letter-spacing: 0.3em; color: rgba(159,198,255,0.4); }
    .sr-boot-msg { margin-top: 16px; font: 300 13px/1.6 Sora, "Noto Sans SC", -apple-system, sans-serif;
      color: rgba(208,220,255,0.66); max-width: 340px; text-align: center;
      animation: sr-boot-pulse 2.4s ease-in-out infinite; }
    .sr-boot-stars { position: absolute; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(1.5px 1.5px at 18% 30%, rgba(214,230,255,0.8), transparent 60%),
        radial-gradient(1px 1px at 72% 22%, rgba(159,198,255,0.7), transparent 60%),
        radial-gradient(1.5px 1.5px at 84% 64%, rgba(255,231,176,0.6), transparent 60%),
        radial-gradient(1px 1px at 30% 74%, rgba(214,230,255,0.55), transparent 60%),
        radial-gradient(1px 1px at 56% 48%, rgba(159,198,255,0.5), transparent 60%),
        radial-gradient(1.5px 1.5px at 8% 56%, rgba(159,198,255,0.4), transparent 60%),
        radial-gradient(1px 1px at 44% 12%, rgba(214,230,255,0.45), transparent 60%),
        radial-gradient(1px 1px at 92% 40%, rgba(159,198,255,0.5), transparent 60%);
      animation: sr-boot-tw 3.6s ease-in-out infinite; }
    @keyframes sr-boot-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes sr-boot-tw { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sr-boot-msg, .sr-boot-stars, .sr-boot-logo { animation: none; } }
  </style>
  <script>
    // 兜底：CDN 断网 / 故障时不再是永远的黑幕
    setTimeout(function () {
      var b = document.getElementById('sr-boot');
      if (b && !b.hasAttribute('data-done')) {
        var m = document.getElementById('sr-boot-msg');
        if (m) {
          m.textContent = '网络不可达 — 星图需要联网加载运行时（React / Babel），请检查连接后刷新。';
          m.style.animation = 'none';
          m.style.opacity = '1';
        }
      }
    }, 8000);
  </script>
