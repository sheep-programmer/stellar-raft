<!-- @dsCard group="Brand" viewport="700x150" name="Logo 星图" subtitle="Constellation mark + light-fall wordmark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-deepspace);padding:24px;display:flex;align-items:center;gap:28px;}
  .logo{font-size:46px;font-weight:var(--w-light);letter-spacing:0.06em;
    background:linear-gradient(176deg,#fff3da 0%,#ffffff 30%,#e9f0ff 62%,#b6cbf2 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 1px 0 rgba(255,250,235,.25)) drop-shadow(0 0 18px rgba(159,198,255,.22));}
  .logo-en{font-size:14px;font-weight:var(--w-regular);letter-spacing:0.22em;text-transform:uppercase;color:var(--text-3);margin-top:6px;}
  .mark{display:flex;flex-direction:column;}
  .small{font-size:22px;}
  .note{color:var(--text-3);font-size:11px;font-family:var(--font-mono);max-width:220px;line-height:1.6;}
</style></head>
<body>
  <span style="flex:none;display:inline-flex;filter:drop-shadow(0 0 9px rgba(255,217,138,0.35))">
    <svg width="58" height="58" viewBox="0 0 26 26" fill="none">
      <rect x="0.5" y="0.5" width="25" height="25" rx="7.5" fill="#080c1c" stroke="rgba(159,198,255,0.28)"/>
      <path d="M7.5 9 L16.5 7 L19 16.5 L11 18.5" stroke="rgba(159,198,255,0.5)" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M7.5 9 L11 18.5" stroke="rgba(255,217,138,0.55)" stroke-width="0.8" stroke-linecap="round"/>
      <circle cx="7.5" cy="9" r="1.35" fill="#d6e6ff"/>
      <circle cx="19" cy="16.5" r="1.15" fill="#9fc6ff"/>
      <circle cx="11" cy="18.5" r="1.1" fill="#9fc6ff"/>
      <circle cx="16.5" cy="7" r="3.4" fill="#ffd98a" opacity="0.22"/>
      <circle cx="16.5" cy="7" r="1.8" fill="#ffe9b0"/>
    </svg>
  </span>
  <div class="mark">
    <div class="logo">星图</div>
    <div class="logo-en">Stellar Raft</div>
  </div>
  <div class="note">标志:深空方块内的小星座 —— 冷蓝星点连成线,一颗暖金「点亮」之星。字标:细字重 · 自上而下受光渐变(暖白→白→星辉冷蓝)。</div>
</body></html>
