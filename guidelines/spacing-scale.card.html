<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="8px rhythm — low density, room to breathe" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-deepspace);padding:24px;}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .c{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .bar{background:linear-gradient(180deg,var(--star-blue),var(--star-blue-deep));border-radius:3px;width:22px;opacity:.8;}
  .l{font-family:var(--font-mono);font-size:10px;color:var(--text-3);}
</style></head>
<body>
  <div class="row">
    <div class="c"><div class="bar" style="height:8px"></div><div class="l">2 · 8</div></div>
    <div class="c"><div class="bar" style="height:12px"></div><div class="l">3 · 12</div></div>
    <div class="c"><div class="bar" style="height:16px"></div><div class="l">4 · 16</div></div>
    <div class="c"><div class="bar" style="height:24px"></div><div class="l">6 · 24</div></div>
    <div class="c"><div class="bar" style="height:32px"></div><div class="l">8 · 32</div></div>
    <div class="c"><div class="bar" style="height:48px"></div><div class="l">12 · 48</div></div>
    <div class="c"><div class="bar" style="height:64px"></div><div class="l">16 · 64</div></div>
    <div class="c"><div class="bar" style="height:80px"></div><div class="l">20 · 80</div></div>
  </div>
</body></html>
