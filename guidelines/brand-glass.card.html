<!-- @dsCard group="Brand" viewport="700x180" name="Glass Panels" subtitle="Deep-blue translucency · 14px blur · 1px cool edge" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-deepspace);padding:24px;}
  /* a faint starfield so the blur reads */
  body::before{content:"";position:fixed;inset:0;background-image:
    radial-gradient(1px 1px at 20% 30%,rgba(159,198,255,.7),transparent),
    radial-gradient(1px 1px at 70% 60%,rgba(255,217,138,.6),transparent),
    radial-gradient(1px 1px at 45% 80%,rgba(159,198,255,.5),transparent),
    radial-gradient(1.5px 1.5px at 85% 25%,rgba(255,255,255,.7),transparent);}
  .row{position:relative;display:flex;gap:16px;}
  .panel{flex:1;padding:18px;border-radius:var(--r-lg);}
  .t{color:var(--text-1);font-size:14px;font-weight:500;margin-bottom:6px;}
  .d{color:var(--text-3);font-size:11px;font-family:var(--font-mono);}
</style></head>
<body>
  <div class="row">
    <div class="panel sr-glass"><div class="t">.sr-glass</div><div class="d">bg .55 · blur 14 · border .14</div></div>
    <div class="panel sr-glass-strong"><div class="t">.sr-glass-strong</div><div class="d">bg .78 · drawer / overlay</div></div>
  </div>
</body></html>
