<!-- @dsCard group="Colors" viewport="700x150" name="Deep Space Backdrop" subtitle="Near-black blue field — knowledge is the only light" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-deepspace);padding:20px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;height:92px;border-radius:var(--r-md);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;}
  .name{color:var(--text-1);font-size:12px;font-weight:500;}
  .hex{color:var(--text-3);font-size:11px;font-family:var(--font-mono);}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--space-void)"><div class="name">void</div><div class="hex">#03040c</div></div>
    <div class="sw" style="background:var(--space-0)"><div class="name">space-0</div><div class="hex">#05060f</div></div>
    <div class="sw" style="background:var(--space-1)"><div class="name">space-1</div><div class="hex">#080a18</div></div>
    <div class="sw" style="background:var(--space-2)"><div class="name">space-2</div><div class="hex">#0b0e22</div></div>
    <div class="sw" style="background:var(--space-3)"><div class="name">space-3</div><div class="hex">#11152e</div></div>
    <div class="sw" style="background:var(--nebula)"><div class="name">nebula</div><div class="hex">#1a2350</div></div>
  </div>
</body></html>
