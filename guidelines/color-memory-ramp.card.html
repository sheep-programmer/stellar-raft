<!-- @dsCard group="Colors" viewport="700x150" name="Memory Temperature Ramp" subtitle="Star color = memory strength: cold dim → warm blazing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-deepspace);padding:20px;}
  .ramp{display:flex;align-items:flex-end;gap:0;height:88px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);}
  .seg{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;}
  .dot{width:16px;height:16px;border-radius:50%;}
  .labels{display:flex;margin-top:8px;}
  .l{flex:1;text-align:center;color:var(--text-3);font-size:10px;font-family:var(--font-mono);}
  .cap{color:var(--text-2);font-size:11px;margin-top:10px;display:flex;justify-content:space-between;}
</style></head>
<body>
  <div class="ramp">
    <div class="seg" style="background:var(--mem-dead)"><div class="dot" style="background:var(--mem-dead)"></div></div>
    <div class="seg" style="background:var(--mem-faint)"><div class="dot" style="background:var(--mem-faint)"></div></div>
    <div class="seg" style="background:var(--mem-low)"><div class="dot" style="background:var(--mem-low)"></div></div>
    <div class="seg" style="background:var(--mem-mid)"><div class="dot" style="background:var(--mem-mid);box-shadow:var(--glow-faint)"></div></div>
    <div class="seg" style="background:var(--mem-high)"><div class="dot" style="background:var(--mem-high);box-shadow:var(--glow-gold-soft)"></div></div>
    <div class="seg" style="background:var(--mem-full)"><div class="dot" style="background:var(--mem-full);box-shadow:var(--glow-gold)"></div></div>
  </div>
  <div class="labels">
    <div class="l">dead</div><div class="l">faint</div><div class="l">low</div><div class="l">mid</div><div class="l">high</div><div class="l">full</div>
  </div>
  <div class="cap"><span>将熄灭 · forgetting</span><span>融会贯通 · mastered</span></div>
</body></html>
