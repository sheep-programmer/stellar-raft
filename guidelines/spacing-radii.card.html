<!-- @dsCard group="Spacing" viewport="700x150" name="Corner Radii" subtitle="Soft panels · full pills for tools — nothing sharp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-deepspace);padding:24px;display:flex;gap:16px;align-items:center;}
  .box{width:78px;height:78px;background:var(--glass-bg);border:1px solid var(--glass-border);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;}
  .l{font-family:var(--font-mono);font-size:10px;color:var(--text-3);}
  .pill{width:auto;padding:0 22px;height:40px;border-radius:var(--r-pill);align-items:center;}
</style></head>
<body>
  <div class="box" style="border-radius:var(--r-sm)"><span class="l">sm·10</span></div>
  <div class="box" style="border-radius:var(--r-md)"><span class="l">md·14</span></div>
  <div class="box" style="border-radius:var(--r-lg)"><span class="l">lg·18</span></div>
  <div class="box" style="border-radius:var(--r-xl)"><span class="l">xl·24</span></div>
  <div class="box pill"><span class="l">pill · tools / chips</span></div>
</body></html>
