<!-- @dsCard group="Icons" viewport="700x430" name="Icon Library" subtitle="Lucide linear · 冷蓝默认 → 暖金激活 · 1.6px stroke" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-deepspace);padding:24px;color:var(--text-2);}
  .sec{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--ls-hud);text-transform:uppercase;color:var(--text-3);margin:0 0 12px;}
  .group{margin-bottom:22px;}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;border-radius:var(--r-md);border:1px solid var(--glass-border);background:rgba(159,198,255,0.035);}
  .cell i{width:22px;height:22px;color:rgba(159,198,255,0.72);}
  .cell.lit{background:rgba(255,217,138,0.08);border-color:rgba(255,217,138,0.26);}
  .cell.lit i{color:var(--gold);filter:drop-shadow(0 0 6px rgba(255,217,138,0.5));}
  .nm{font-family:var(--font-mono);font-size:9px;color:var(--text-3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .lit .nm{color:var(--gold);}
  .hint{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3);margin-bottom:18px;}
  .dot{width:7px;height:7px;border-radius:50%;}
</style></head>
<body>
  <div class="hint">
    <span class="dot" style="background:rgba(159,198,255,0.72)"></span>默认 · star-blue .7
    <span style="width:14px"></span>
    <span class="dot" style="background:var(--gold);box-shadow:var(--glow-gold-soft)"></span>悬停 / 激活 · gold + glow
  </div>

  <div class="group">
    <div class="sec">导航 · Navigation</div>
    <div class="grid" id="nav"></div>
  </div>
  <div class="group">
    <div class="sec">星图与工具 · Map &amp; Tools</div>
    <div class="grid" id="tools"></div>
  </div>
  <div class="group">
    <div class="sec">编辑器块 · Editor blocks</div>
    <div class="grid" id="blocks"></div>
  </div>
  <div class="group">
    <div class="sec">操作 · Actions</div>
    <div class="grid" id="actions"></div>
  </div>

  <script src="https://unpkg.com/lucide@1.45.0/dist/umd/lucide.min.js"
    integrity="sha384-1K5mjRr9EvBwlp0ALeQf1DEysXoqYs+nRQmDBi/UrEty5RgCjPRph7NJZkRjAFWJ" crossorigin="anonymous"></script>
  <script>
    const sets = {
      nav: ['orbit','list','git-commit-horizontal','inbox','search','panel-left-close','activity','crosshair'],
      tools: [['satellite',1],['hourglass',0],['rotate-ccw',0],['waypoints',0],['link',0],['calendar-clock',0],['zap',1],['sparkles',1]],
      blocks: ['heading-1','heading-2','list-ordered','code','sigma','table','image','minus','bold','italic','highlighter','quote'],
      actions: ['plus','x','check','more-horizontal','maximize-2','corner-up-left','hash','folder-input','repeat','arrow-up-down','trash-2','copy'],
    };
    for (const [id, arr] of Object.entries(sets)) {
      const host = document.getElementById(id);
      arr.forEach(item => {
        const [name, lit] = Array.isArray(item) ? item : [item, 0];
        const c = document.createElement('div');
        c.className = 'cell' + (lit ? ' lit' : '');
        c.innerHTML = `<i data-lucide="${name}"></i><span class="nm">${name}</span>`;
        host.appendChild(c);
      });
    }
    lucide.createIcons({ attrs: { 'stroke-width': 1.6 } });
  </script>
</body></html>
