<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-deepspace);padding:24px;display:flex;gap:34px;align-items:center;justify-content:center;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .orb{width:34px;height:34px;border-radius:50%;}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--text-3);}
</style></head>
<body>
  <div class="cell"><div class="orb" style="background:var(--star-blue);box-shadow:var(--glow-faint)"></div><div class="lab">--glow-faint</div></div>
  <div class="cell"><div class="orb" style="background:var(--star-blue);box-shadow:var(--glow-blue)"></div><div class="lab">--glow-blue</div></div>
  <div class="cell"><div class="orb" style="background:var(--gold);box-shadow:var(--glow-gold-soft)"></div><div class="lab">--glow-gold-soft</div></div>
  <div class="cell"><div class="orb" style="background:var(--gold-white);box-shadow:var(--glow-gold)"></div><div class="lab">--glow-gold</div></div>
</body></html>
