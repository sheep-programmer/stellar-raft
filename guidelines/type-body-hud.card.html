<!-- @dsCard group="Type" viewport="700x180" name="Body & Mono / HUD" subtitle="Loose reading body + tabular HUD labels" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-deepspace);padding:24px;color:var(--text-1);}
  .stack{display:flex;flex-direction:column;gap:16px;}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-bottom:6px;}
  .hud{display:flex;gap:22px;}
  .h{display:flex;flex-direction:column;gap:3px;}
  .hl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--ls-hud);text-transform:uppercase;color:var(--text-3);}
  .hv{font-family:var(--font-mono);font-size:20px;color:var(--star-blue);}
</style></head>
<body>
  <div class="stack">
    <div>
      <div class="tag">body · 17 / 400 / lh 1.8</div>
      <div style="font-size:var(--t-body-lg);line-height:var(--lh-loose);color:var(--text-2);max-width:560px">贝尔不等式表明，任何定域隐变量理论都无法重现量子力学的全部预测。实验上的违背，确立了量子纠缠的非定域性。</div>
    </div>
    <div>
      <div class="tag">mono / HUD · JetBrains Mono</div>
      <div class="hud">
        <div class="h"><span class="hl">Knowledge Stars</span><span class="hv">1,284</span></div>
        <div class="h"><span class="hl">正发光</span><span class="hv" style="color:var(--gold)">312</span></div>
        <div class="h"><span class="hl">正变暗</span><span class="hv" style="color:var(--star-blue-dim)">47</span></div>
        <div class="h"><span class="hl">连接数</span><span class="hv">2,901</span></div>
      </div>
    </div>
  </div>
</body></html>
